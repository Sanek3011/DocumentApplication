services:
  docs-db:
    image: postgres:14
    container_name: docs-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: docstool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  docs-app:
    build:
      context: .
    container_name: docs-app
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://docs-db:5432/docstool
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - docs-db


volumes:
  postgres-data: